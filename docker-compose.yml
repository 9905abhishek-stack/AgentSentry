services:
  agentsentry-api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      QDRANT_HOST: qdrant
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-audit_evidence}
      CORPUS_REVISION: ${CORPUS_REVISION:-1}
      REDIS_URL: redis://redis:6379/0
      VLLM_API_BASE: ${VLLM_API_BASE:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-EMPTY}
      VLLM_MODEL: ${VLLM_MODEL:-meta-llama/Meta-Llama-3.1-8B-Instruct}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped

volumes:
  qdrant_data:
